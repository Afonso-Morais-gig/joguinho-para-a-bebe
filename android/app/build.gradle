plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.targetspeed'
    compileSdk 34
    ndkVersion '26.1.10909125'   // change to any NDK you have installed

    defaultConfig {
        applicationId 'com.example.targetspeed'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0'

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_static'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'jni/CMakeLists.txt'
            version '3.22.1'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
